<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAXORA • The Future of Luxury Commerce</title>
    <meta name="description" content="BAXORA - Ultra-premium AI-powered multi-vendor luxury marketplace.">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lenis/1.0.0/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    </style>
</head>
<body>
    <!-- NAV -->
    <nav class="lux-nav">
        <div class="nav-container">
            <div class="logo">BAXORA</div>
            <div class="nav-links">
                <a href="#" onclick="navigateTo('home')">Discover</a>
                <a href="#" onclick="navigateTo('shop')">Shop</a>
                <a href="#" onclick="navigateTo('brands')">Brands</a>
                <a href="#" onclick="navigateTo('concierge')">Concierge</a>
            </div>
            <div class="nav-actions">
                <button onclick="toggleSearch()" class="icon-btn">⌕</button>
                <button onclick="toggleCart()" class="icon-btn">🛍️</button>
                <button onclick="showProfile()" class="profile-btn">👤</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section id="home" class="hero">
        <div id="hero-canvas" class="hero-canvas"></div>
        <div class="hero-content">
            <h1 class="hero-title">The Future of<br>Luxury Commerce</h1>
            <p class="hero-subtitle">Timeless elegance. Intelligent discovery.</p>
            <div class="hero-cta">
                <button onclick="navigateTo('shop')" class="lux-btn primary">Explore Collections</button>
                <button onclick="showConcierge()" class="lux-btn secondary">Speak to Concierge</button>
            </div>
        </div>
        <div class="floating-objects">
            <!-- 3D placeholders via JS -->
        </div>
    </section>

    <!-- CATEGORIES -->
    <section class="section categories">
        <h2 class="section-title">Curated Worlds</h2>
        <div class="category-grid" id="category-grid"></div>
    </section>

    <!-- FEATURED PRODUCTS -->
    <section class="section featured">
        <h2 class="section-title">New Arrivals • Limited Editions</h2>
        <div class="product-grid" id="product-grid"></div>
    </section>

    <!-- AI RECOMMENDATIONS -->
    <section class="section ai-recs">
        <h2 class="section-title">AI Personal Shopper</h2>
        <div class="ai-chat">
            <input type="text" id="ai-input" placeholder="Describe your dream piece..." onkeypress="if(event.key==='Enter') simulateAIResponse()">
            <button onclick="simulateAIResponse()">Ask</button>
        </div>
    </section>

    <!-- VENDOR HIGHLIGHTS -->
    <section class="section vendors">
        <h2 class="section-title">Exquisite Houses</h2>
        <div class="vendor-slider swiper">
            <!-- Swiper populated by JS -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="lux-footer">
        <div class="footer-content">
            <p>&copy; 2026 BAXORA. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Careers</a>
            </div>
        </div>
    </footer>

    <!-- MODALS -->
    <div id="search-modal" class="modal">
        <div class="modal-content">
            <input type="text" placeholder="Search the universe of luxury..." id="global-search">
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h3>Your Cart</h3>
            <div id="cart-items"></div>
            <button onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
